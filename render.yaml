services:
  - type: web
    name: flexpay-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node src/server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
