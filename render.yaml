services:
  - type: web
    name: flexpay-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SAFARICOM_ENV
        value: mock
      - key: CORS_ORIGIN
        value: "*"
